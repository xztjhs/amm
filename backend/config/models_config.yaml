# ============================================================
# 7. Text-to-Image Model (Qwen-Image-2512)
# ============================================================
t2i_model:
  id: "t2i"
  name: "文生图 (Text-to-Image)"
  description: "文字生成图片 - Qwen-Image-2512"
  category: "image"
  port: 18087
  engine_type: "diffusers"
  available_engines: ["diffusers"]
  model_source: "modelscope"
  model_id: "Qwen/Qwen-Image-2512"
  available_models:
    - name: "Qwen-Image-2512"
      source: "modelscope"
      model_id: "Qwen/Qwen-Image-2512"
      size_gb: 15.0
  parameters:
    - name: "width"
      label: "图片宽度"
      type: "number"
      default: 1024
      min: 512
      max: 2048
    - name: "height"
      label: "图片高度"
      type: "number"
      default: 1024
      min: 512
      max: 2048
    - name: "num_inference_steps"
      label: "推理步数"
      type: "number"
      default: 28
      min: 10
      max: 100
    - name: "guidance_scale"
      label: "引导强度"
      type: "float"
      default: 5.0
      min: 1.0
      max: 20.0
      step: 0.5
    - name: "seed"
      label: "随机种子"
      type: "number"
      default: -1
      min: -1
      max: 4294967295
    - name: "num_images"
      label: "生成数量"
      type: "number"
      default: 1
      min: 1
      max: 4
    - name: "scheduler"
      label: "调度器"
      type: "select"
      default: "flow_match_euler"
      options: ["flow_match_euler", "flow_match_heun", "euler", "dpm_solver"]

