# ============================================================
# 8. Text-to-Video Model (Wan2.2-T2V-A14B)
# ============================================================
t2v_model:
  id: "t2v"
  name: "文生视频 (Text-to-Video)"
  description: "文字生成视频 - Wan2.2-T2V-A14B"
  category: "video"
  port: 18088
  engine_type: "diffusers"
  available_engines: ["diffusers"]
  model_source: "modelscope"
  model_id: "Wan-AI/Wan2.2-T2V-A14B-Diffusers"
  # 量化与显存优化 (2026-08-05)
  # Wan2.2 MoE 27B, BF16 静态 ~75G OOM, 必须 FP8 存储 + BF16 计算
  quant: "fp8"               # fp8 | bf16 | none ; 空则自动 (video+A14B -> fp8)
  compute_dtype: "bf16"      # 前向计算精度
  boundary_ratio: 0.875      # Wan2.2 MoE 官方默认, SNR=-1.5 分界
  cpu_offload: false         # 默认靠 enable_model_cpu_offload ; OOM 时改 true
  available_models:
    - name: "Wan2.2-T2V-A14B-Diffusers"
      source: "modelscope"
      model_id: "Wan-AI/Wan2.2-T2V-A14B-Diffusers"
      size_gb: 28.0
  parameters:
    - name: "resolution"
      label: "分辨率"
      type: "select"
      default: "480p"
      options: ["480p", "720p"]
    - name: "num_frames"
      label: "帧数"
      type: "number"
      default: 81
      min: 17
      max: 161
    - name: "frame_rate"
      label: "帧率"
      type: "number"
      default: 16
      min: 8
