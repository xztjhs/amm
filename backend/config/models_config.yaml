  parameters:
    - name: "ctx_size"
      label: "上下文长度"
      type: "number"
      default: 8192
      min: 512
      max: 32768
      engine: "llama_cpp"
    - name: "n_gpu_layers"
      label: "GPU 层数"
      type: "number"
      default: -1
      min: -1
      max: 256
      engine: "llama_cpp"
    - name: "threads"
      label: "CPU 线程数"
      type: "number"
      default: 4
      min: 1
      max: 128
      engine: "llama_cpp"
    - name: "batch_size"
      label: "批处理大小"
      type: "number"
      default: 1024
      min: 256
      max: 4096
      engine: "llama_cpp"
    - name: "embeddings"
      label: "嵌入模式"
      type: "boolean"
      default: true
      engine: "llama_cpp"
    - name: "flash_attn"
      label: "Flash Attention"
      type: "boolean"
      default: true
      engine: "llama_cpp"
    - name: "mlock"
      label: "内存锁定"
      type: "boolean"
      default: true
      engine: "llama_cpp"
    - name: "tensor_parallel_size"
      label: "GPU 并行数"
      type: "number"
      default: 1
      min: 1
      max: 8
      engine: "vllm"
    - name: "gpu_memory_utilization"
      label: "GPU 显存利用率"
      type: "float"
      default: 0.90
      min: 0.1
      max: 1.0
      step: 0.05
      engine: "vllm"

