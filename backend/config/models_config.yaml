# AMM Model Configuration
# ==============================================
# 混合推理引擎架构:
#   引擎: vllm / llama_cpp / diffusers
#   每类模型可单独选择引擎和版本
# ==============================================

server:
  host: "0.0.0.0"
  port: 8080         # 容器内对外端口，宿主机映射为 60008（所有 OpenAI 请求统一走此端口）
  models_dir: "/models"
  logs_dir: "/amm/logs"

# ============================================================
# 1. Chat / LLM / VLM Model
# ============================================================
chat_model:
  id: "chat"
  name: "Chat / LLM / VLM"
  description: "通用对话、文本生成、视觉语言模型"
  category: "chat"
  port: 18081
  engine_type: "llama_cpp"
  engine_version: ""   # 空 = 使用默认版本
  available_engines: ["llama_cpp", "vllm"]
  available_models:
    - name: "Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-Q4_K_M"
      file: "HauhauCS/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-Q4_K_M.gguf"
      engine: "llama_cpp"
      size_gb: 20.5
      type: "Q4_K_M"
  parameters:
    - name: "ctx_size"
      label: "上下文长度"
      type: "number"
      default: 32768
      min: 512
      max: 131072
      engine: "llama_cpp"
    - name: "tensor_parallel_size"
      label: "GPU 并行数"
      type: "number"
      default: 1
      min: 1
      max: 8
      engine: "vllm"
    - name: "gpu_memory_utilization"
      label: "GPU 显存利用率"
      type: "float"
      default: 0.90
      min: 0.1
      max: 1.0
      step: 0.05
      engine: "vllm"
    - name: "max_model_len"
      label: "最大模型长度"
      type: "number"
      default: 32768
      min: 512
      max: 131072
      engine: "vllm"
    - name: "dtype"
      label: "推理精度"
      type: "select"
      default: "auto"
      options: ["auto", "float16", "bfloat16", "float32"]
      engine: "vllm"
    - name: "n_gpu_layers"
      label: "GPU 层数"
      type: "number"
      default: -1
      min: -1
      max: 256
      engine: "llama_cpp"
    - name: "threads"
      label: "CPU 线程数"
      type: "number"
      default: 8
      min: 1
      max: 256
      engine: "llama_cpp"
    - name: "batch_size"
      label: "批处理大小"
      type: "number"
      default: 2048
      min: 256
      max: 8192
      engine: "llama_cpp"
    - name: "temp"
      label: "温度"
      type: "float"
      default: 0.7
      min: 0.0
      max: 2.0
      step: 0.05
      engine: "llama_cpp"
    - name: "top_p"
      label: "Top-P 采样"
      type: "float"
      default: 0.9
      min: 0.0
      max: 1.0
      step: 0.05
      engine: "llama_cpp"
    - name: "top_k"
      label: "Top-K 采样"
      type: "number"
      default: 40
      min: 1
      max: 200
      engine: "llama_cpp"
    - name: "repeat_penalty"
      label: "重复惩罚"
      type: "float"
      default: 1.1
      min: 1.0
      max: 2.0
      step: 0.05
      engine: "llama_cpp"
    - name: "max_tokens"
      label: "最大生成Token"
      type: "number"
      default: 4096
      min: 1
      max: 32768
      engine: "llama_cpp"
    - name: "flash_attn"
      label: "Flash Attention"
      type: "boolean"
      default: true
      engine: "llama_cpp"
    - name: "mlock"
      label: "内存锁定"
      type: "boolean"
      default: true
      engine: "llama_cpp"

# ============================================================
# 2. Embedding Model
# ============================================================
embedding_model:
  id: "embedding"
