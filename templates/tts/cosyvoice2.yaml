# CosyVoice2 — 语音合成
id: cosyvoice2
name: CosyVoice2
category: tts
description: 阿里 CosyVoice2 语音合成，支持零样本音色克隆与情感控制。
tags: [tts, voice-clone, chinese]
vram_hint_gb: 8
sources:
