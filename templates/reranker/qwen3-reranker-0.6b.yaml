# Qwen3-Reranker-0.6B — 重排序（官方 0.6B，演示用）
id: qwen3-reranker-0.6b
name: Qwen3-Reranker-0.6B
category: reranker
description: 通义千问3 官方 0.6B 重排序模型，RAG 场景对召回结果精排；GGUF 走 llama.cpp（--reranking）。
tags: [reranker, qwen3, rag, demo]
context_length: 32768
vram_hint_gb: 2
model_file: "amm/Qwen3-Reranker-0.6B-Q8_0.gguf"
sources:
  - provider: huggingface
    repo_id: ggml-org/Qwen3-Reranker-0.6B-Q8_0-GGUF
    files: [qwen3-reranker-0.6b-q8_0.gguf]
  - provider: huggingface
    repo_id: Qwen/Qwen3-Reranker-0.6B
engines:
  - engine: llama_cpp
    version: latest
    flavor: cuda
    params:
      ctx_size: 8192
      n_gpu_layers: -1
      reranking: true
      batch_size: 1024
      flash_attn: true
  - engine: sentence_transformers
    version: "3.3.1"
    flavor: cuda
    params:
      device: auto
      batch_size: 32
      normalize: true
      max_seq_length: 8192
parameters:
  - { name: ctx_size, label: 上下文长度, type: number, default: 8192, min: 512, max: 32768 }
  - { name: n_gpu_layers, label: GPU 层数, type: number, default: -1, min: -1, max: 256 }
  - { name: reranking, label: 重排序模式, type: boolean, default: true }
quantization: [Q8_0, BF16]
